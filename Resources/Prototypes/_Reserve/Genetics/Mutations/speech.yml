# based on Trauma-Station: Resources/Prototypes/_Trauma/Genetics/Mutations/speech.yml

- type: entity
  parent: BaseFreeMutation
  id: MutationNervousness
  name: Nervousness
  description: Causes the holder to stutter.
  components:
  - type: ComponentMutation
    added:
    - type: StutteringAccent

- type: entity
  parent: BaseMutation
  id: MutationMute
  name: Mute
  description: Completely inhibits the vocal section of the brain.
  components:
  - type: Mutation
    instability: -40
  - type: RemovesMutation
    removes:
    - MutationUnintelligible # no free -70
  - type: ComponentMutation
    added:
    - type: Muted

- type: entity
  parent: BaseMutation
  id: MutationUnintelligible
  name: Unintelligible
  description: Partially inhibits the vocal center of the brain, severely distorting speech.
  components:
  - type: Mutation
    instability: -30
    conflicts:
    - MutationMute # can upgrade to Mute
  - type: ComponentMutation
    added:
    - type: ScrambledAccent

- type: entity
  parent: BaseFreeMutation
  id: MutationStoner
  name: Stoner
  description: A common mutation that severely decreases intelligence.
  components:
  - type: Mutation
    locked: true
  # TODO

- type: entity
  parent: BaseFreeMutation
  id: MutationMedieval
  name: Medieval
  description: A horrible mutation originating from the distant past, thought to have once been a common gene in all of old world Europe.
  components:
  - type: ComponentMutation
    added:
    - type: MedievalAccent